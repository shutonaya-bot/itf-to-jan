<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<title>ITF → JAN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#111}
main{max-width:560px;margin:auto;padding:22px 16px 40px}
h1{text-align:center;font-size:30px;margin:12px 0 6px}
.sub{text-align:center;color:#666;margin-bottom:18px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000012}
#reader{width:100%;overflow:hidden;border-radius:14px;background:#111;min-height:80px}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:#111827;color:white;margin-top:12px}
button.secondary{background:#e5e7eb;color:#111}
.label{font-size:14px;color:#777}
.jan{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:800;letter-spacing:1px;text-align:center;margin-top:5px}
.itf{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;text-align:center;margin-top:5px}
.msg{text-align:center;line-height:1.5}
.note{font-size:13px;color:#666;line-height:1.6}
.ok{color:#0a7b34}.err{color:#b42318}
</style>
</head>
<body>
<main>
<h1>ITF → JAN</h1>
<div class="sub">ITF-14を読み取ってJAN-13へ変換</div>

<div class="card">
  <div id="reader"></div>
  <button id="start">📷 カメラでITFを読み取る</button>
  <button id="stop" class="secondary" style="display:none">カメラを止める</button>
</div>

<div class="card">
  <div class="label">読み取ったITF</div>
  <div id="itf" class="itf">—</div>
  <hr>
  <div class="label">変換後JAN</div>
  <div id="jan" class="jan">—</div>
  <p id="message" class="msg"></p>
</div>

<div class="card note">
<b>使い方</b><br>
①「カメラでITFを読み取る」→ ② ITFバーコードをカメラにかざす → ③ JANを表示<br><br>
このアプリは通常の集合包装用GTIN-14（ITF-14）を対象にしています。読み取った数字からJANのチェックデジットを計算します。
</div>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let scanner = null;
let running = false;

function digits(s){ return (s || "").replace(/\D/g,""); }

function checkDigit(body){
  let sum=0, rev=body.split("").reverse();
  for(let i=0;i<rev.length;i++){
    sum += Number(rev[i]) * (i%2===0 ? 3 : 1);
  }
  return (10 - (sum % 10)) % 10;
}

function validGTIN14(code){
  if(code.length!==14 || !/^\d+$/.test(code)) return false;
  return Number(code[13]) === checkDigit(code.slice(0,13));
}

function validJAN13(code){
  if(code.length!==13 || !/^\d+$/.test(code)) return false;
  return Number(code[12]) === checkDigit(code.slice(0,12));
}

function convert(raw){
  const code = digits(raw);
  $("itf").textContent = code || "—";
  $("jan").textContent = "—";
  $("message").className = "msg";

  if(code.length !== 14){
    $("message").textContent = "14桁のITF-14を読み取ってください。";
    $("message").classList.add("err");
    return false;
  }

  if(code[0] === "0"){
    const jan = code.slice(1);
    if(validJAN13(jan)){
      $("jan").textContent = jan;
      $("message").textContent = "先頭0を除いてJAN-13として取得しました。";
      $("message").classList.add("ok");
      return true;
    }
    $("message").textContent = "先頭0ですが、JAN-13のチェックデジットが一致しません。";
    $("message").classList.add("err");
    return false;
  }

  if(!/[1-8]/.test(code[0])){
    $("message").textContent = "先頭が1～8ではないため、自動変換できません。";
    $("message").classList.add("err");
    return false;
  }

  if(!validGTIN14(code)){
    $("message").textContent = "ITF-14のチェックデジットが一致しません。";
    $("message").classList.add("err");
    return false;
  }

  const body12 = code.slice(1,13);
  const jan = body12 + checkDigit(body12);
  $("jan").textContent = jan;
  $("message").textContent = "JANを自動計算しました。";
  $("message").classList.add("ok");
  return true;
}

async function stop(){
  if(scanner && running){
    try{ await scanner.stop(); }catch(e){}
    running=false;
  }
  $("start").style.display="";
  $("stop").style.display="none";
}

$("start").onclick = async ()=>{
  if(!window.isSecureContext){
    $("message").textContent="カメラ利用にはHTTPSのページが必要です。";
    $("message").className="msg err";
    return;
  }
  if(!window.Html5Qrcode){
    $("message").textContent="バーコード読み取り機能の読み込みに失敗しました。通信状態を確認してください。";
    $("message").className="msg err";
    return;
  }

  scanner = new Html5Qrcode("reader");
  $("start").style.display="none";
  $("stop").style.display="";
  running=true;

  try{
    await scanner.start(
      {facingMode:"environment"},
      {
        fps:10,
        qrbox:{width:Math.min(320,window.innerWidth-70),height:160},
        aspectRatio:1.777
      },
      async (decodedText)=>{
        const code=digits(decodedText);
        if(code.length===14){
          convert(code);
          await stop();
        }
      },
      ()=>{}
    );
  }catch(e){
    running=false;
    $("start").style.display="";
    $("stop").style.display="none";
    $("message").textContent="カメラを開始できませんでした。Safariのカメラ許可を確認してください。";
    $("message").className="msg err";
  }
};

$("stop").onclick=stop;
</script>
</body>
</html>
