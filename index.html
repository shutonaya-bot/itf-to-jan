<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITF → JAN</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;margin:0;padding:20px;background:#f5f5f7}
h1{font-size:32px}
#reader{width:100%;max-width:600px;margin:auto}
button{font-size:20px;padding:15px 25px;margin:15px;border:0;border-radius:12px;background:#111;color:white}
.box{background:white;border-radius:18px;padding:20px;margin:20px auto;max-width:600px}
.label{color:#666;margin-top:10px}
.value{font-size:30px;font-weight:bold;word-break:break-all;margin:8px}
.ok{color:green}
.error{color:red}
</style>
</head>

<body>

<h1>ITF → JAN</h1>

<div class="box">
<div id="reader"></div>
<button id="start">📷 カメラで読み取る</button>
<button id="stop" style="display:none">カメラ停止</button>
</div>

<div class="box">
<div class="label">読み取ったコード</div>
<div id="raw" class="value">---</div>

<div class="label">変換後JAN</div>
<div id="jan" class="value">---</div>

<div id="msg"></div>
</div>

<script>
let scanner=null;
let running=false;

function checkDigit(body){
  let sum=0;
  let n=0;
  for(let i=body.length-1;i>=0;i--,n++){
    sum+=Number(body[i])*(n%2===0?3:1);
  }
  return String((10-sum%10)%10);
}

function valid(code){
  if(!/^\d+$/.test(code)) return false;
  return checkDigit(code.slice(0,-1))===code.slice(-1);
}

function normalize(s){
  s=String(s).trim();

  // GS1-128の識別子
  s=s.replace(/^\]C1/,"");

  // (01)14987376553718
  let m=s.match(/^\(01\)\s*(\d{14})/);
  if(m) return m[1];

  // 0114987376553718
  m=s.match(/^01(\d{14})/);
  if(m) return m[1];

  let d=s.replace(/\D/g,"");

  if(d.length===14) return d;
  if(d.length===16 && d.startsWith("01")) return d.slice(2);

  return d;
}

function convert(s){

  s=normalize(s);

  if(!/^\d{14}$/.test(s)){
    throw new Error("14桁のGTIN-14を読み取れませんでした");
  }

  if(!valid(s)){
    throw new Error("バーコードのチェックデジットが正しくありません");
  }

  // 0 + JAN13
  if(s[0]==="0"){
    let j=s.slice(1);
    if(valid(j)) return j;
  }

  // indicator + JAN本体12桁 + GTIN14チェック
  if(!/^[1-8]$/.test(s[0])){
    throw new Error("対応していないGTIN-14です");
  }

  let body=s.slice(1,13);
  return body+checkDigit(body);
}

function result(text){

  let code=normalize(text);

  document.getElementById("raw").textContent=code;

  try{
    let jan=convert(code);

    document.getElementById("jan").textContent=jan;
    document.getElementById("jan").className="value ok";

    document.getElementById("msg").textContent="変換成功";
    document.getElementById("msg").className="ok";

    stopCamera();

  }catch(e){

    document.getElementById("jan").textContent="---";
    document.getElementById("jan").className="value";

    document.getElementById("msg").textContent=e.message;
    document.getElementById("msg").className="error";
  }
}

async function startCamera(){

  if(running)return;

  scanner=new Html5Qrcode("reader");

  let config={
    fps:10,
    qrbox:function(w,h){
      return{
        width:Math.min(w*0.9,700),
        height:Math.min(h*0.45,250)
      };
    },
    experimentalFeatures:{
      useBarCodeDetectorIfSupported:false
    }
  };

  try{

    await scanner.start(
      {facingMode:"environment"},
      config,
      function(text){
        result(text);
      },
      function(){}
    );

    running=true;

    document.getElementById("start").style.display="none";
    document.getElementById("stop").style.display="inline-block";

  }catch(e){

    document.getElementById("msg").textContent=
      "カメラを起動できませんでした："+e.message;
  }
}

async function stopCamera(){

  if(!scanner||!running)return;

  try{
    await scanner.stop();
    scanner.clear();
  }catch(e){}

  running=false;

  document.getElementById("start").style.display="inline-block";
  document.getElementById("stop").style.display="none";
}

document.getElementById("start").onclick=startCamera;
document.getElementById("stop").onclick=stopCamera;

</script>

</body>
</html>
